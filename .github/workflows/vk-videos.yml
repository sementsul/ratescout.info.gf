name: VK video poster

# Раз в 2 дня публикует один ролик из my-many/promo на стену VK-группы, чередуя подпись
# ratescout.ru / my-many.ru. Секреты: VK_USER_TOKEN (пользовательский, video/wall), VK_GROUP_ID,
# GH_PAT (коммит состояния vk_posted.json). На push этого файла — СУХОЙ прогон (не публикует).

on:
  # 🔴 ПАУЗА (2026-09-09): расписание отключено. Причина: video.save требует ПОЛЬЗОВАТЕЛЬСКИЙ токен (VK_USER_TOKEN),
  # а бессрочный user-токен только «серым» приёмом (Kate Mobile) — он привёл к БЛОКУ аккаунта владельца.
  # Оставлен только ручной запуск. Вернуть расписание — когда решим вопрос с безопасным user-токеном (UC-73a #16).
  # schedule:
  #   - cron: "20 9 */2 * *"      # ~12:20 МСК, раз в 2 дня
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Сухой прогон (не публиковать)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vk-videos
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Post next video to VK (dry on push)
        env:
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_REFRESH_TOKEN: ${{ secrets.VK_REFRESH_TOKEN }}
          VK_DEVICE_ID: ${{ secrets.VK_DEVICE_ID }}
          VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_REFRESH_OUT: ${{ runner.temp }}/vk_new_refresh   # сюда постер кладёт новый refresh при ротации
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python3 vk_video_post.py
      - name: Persist rotated VK refresh token (if any)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VK_REFRESH_OUT: ${{ runner.temp }}/vk_new_refresh
        run: |
          if [ -s "$VK_REFRESH_OUT" ]; then
            gh secret set VK_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" --body "$(cat "$VK_REFRESH_OUT")" \
              && echo "✅ VK_REFRESH_TOKEN обновлён в секретах" \
              || echo "⚠️ не удалось сохранить новый refresh (проверь доступ GH_PAT к secrets)"
            rm -f "$VK_REFRESH_OUT"
          else
            echo "refresh не ротировался (или refresh-секретов нет) — сохранять нечего."
          fi
      - name: Commit state
        run: |
          git config user.name "vk-video-bot"
          git config user.email "vk-video-bot@users.noreply.github.com"
          git add vk_dryrun.json 2>/dev/null || true
          git add vk_posted.json 2>/dev/null || true
          git add vk_result.json 2>/dev/null || true
          git commit -m "chore: vk video state [skip ci]" || { echo "нет изменений"; exit 0; }
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
