name: GA4 report to Telegram (28d)

# Еженедельный отчёт Google Analytics (GA4) за 28 дней в админ-чат.
# Секреты: GA4_PROPERTY_ID, GA_SA_JSON (или переиспользуем GSC_SA_JSON), TELEGRAM_TOKEN, ALERT_CHAT_ID.

on:
  schedule:
    - cron: "0 6 * * 1"      # понедельник ~09:00 МСК
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth requests
      - name: Send GA4 report
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA_SA_JSON: ${{ secrets.GA_SA_JSON }}
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
        run: python3 ga_report_tg.py
