name: Keepalive (heartbeat)

# Держит репозиторий «активным»: GitHub отключает scheduled-workflow после 60 дней без
# активности. Раз в неделю крохотный коммит-heartbeat → часовой deploy.yml продолжает работать.

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Commit heartbeat (push via PAT)
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "sementsul"
          git config user.email "45505876+sementsul@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
          git add .github/heartbeat.txt
          git commit -m "chore: keepalive heartbeat [skip ci]" || { echo "no changes"; exit 0; }
          git push "https://x-access-token:${PAT}@github.com/sementsul/ratescout.info.gf.git" HEAD:main
